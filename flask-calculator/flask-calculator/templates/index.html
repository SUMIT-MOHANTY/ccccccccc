<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="calculator-container">
        <h1>Flask Calculator</h1>

        <noscript>
            <p class="error">This calculator requires JavaScript to be enabled. Please enable JavaScript in your browser.</p>
        </noscript>

        <form id="calculator-form" action="/calculate" method="post">
            <div class="form-group">
                <label for="num1">First Number:</label>
                <input type="number" id="num1" name="num1" step="any" required>
            </div>

            <div class="form-group">
                <label for="operation">Operation:</label>
                <select id="operation" name="operation" required>
                    <option value="">Select operation</option>
                    <option value="add">+ Add</option>
                    <option value="subtract">- Subtract</option>
                    <option value="multiply"> Multiply</option>
                    <option value="divide"> Divide</option>
                </select>
            </div>

            <div class="form-group">
                <label for="num2">Second Number:</label>
                <input type="number" id="num2" name="num2" step="any" required>
            </div>

            <button type="submit">Calculate</button>
            <button type="button" id="reset-btn">Reset</button>
        </form>

        <div id="result-container" style="display: none;">
            <h2>Result:</h2>
            <p id="result-text"></p>
        </div>

        <div id="error-container" class="error" style="display: none;">
            <h2>Error:</h2>
            <p id="error-text"></p>
        </div>

        <div class="sample-calculations">
            <h3>Sample Calculations:</h3>
            <p>Try these test cases:</p>
            <ul>
                <li>15 + 3 = 18</li>
                <li>15 - 3 = 12</li>
                <li>15  3 = 45</li>
                <li>15  3 = 5</li>
                <li>10  0 = Error (division by zero)</li>
                <li>1e309 + 1 = Error (too large)</li>
            </ul>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
